<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Filter Cards with Animation</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Profile Cards</h1>
        <p>CSS filters, hover effects, and keyframe animation.</p>
    </header>

    <main>
        <section class="profiles" aria-label="Profile cards">
            <article class="profile-card">
                <img class="profile-image grayscale" src="https://images.unsplash.com/photo-1500648767791-00dcc994a43e?auto=format&fit=crop&w=600&q=80" alt="Profile portrait">
                <div class="profile-content">
                    <h2>Alex Morgan</h2>
                    <p>UI Designer</p>
                    <span>Creates simple and useful interfaces.</span>
                </div>
            </article>

            <article class="profile-card">
                <img class="profile-image sepia" src="https://images.unsplash.com/photo-1494790108377-be9c29b29330?auto=format&fit=crop&w=600&q=80" alt="Profile portrait">
                <div class="profile-content">
                    <h2>Jamie Lee</h2>
                    <p>Developer</p>
                    <span>Builds responsive and accessible websites.</span>
                </div>
            </article>

            <article class="profile-card">
                <img class="profile-image contrast" src="https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?auto=format&fit=crop&w=600&q=80" alt="Profile portrait">
                <div class="profile-content">
                    <h2>Chris Taylor</h2>
                    <p>Product Manager</p>
                    <span>Connects ideas, people, and product goals.</span>
                </div>
            </article>
        </section>
    </main>

    <footer>
        <p>Assignment 9 &mdash; Question 5</p>
    </footer>
</body>
</html>
