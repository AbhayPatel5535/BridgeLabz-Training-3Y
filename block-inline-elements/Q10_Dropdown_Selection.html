<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Location Selection</title>
</head>
<body>

    <h1>Location Selection</h1>

    <!-- Country -->
    <label for="country">
        Country:
    </label>

    <select id="country">

        <option selected>India</option>
        <option>United States</option>
        <option>United Kingdom</option>
        <option>Australia</option>

    </select>

    <br><br>

    <!-- State -->
    <label for="state">
        State:
    </label>

    <select id="state">

        <option selected>Uttar Pradesh</option>
        <option>Rajasthan</option>
        <option>Maharashtra</option>
        <option>Goa</option>

    </select>

    <br><br>

    <!-- City -->
    <label for="city">
        City:
    </label>

    <select id="city">

        <option selected>Mathura</option>
        <option>Agra</option>
        <option>Jaipur</option>
        <option>Delhi</option>

    </select>

    <br><br>

    <!-- Favorite Tourist Place -->
    <label for="place">
        Favorite Tourist Place:
    </label>

    <select id="place">

        <option selected>Taj Mahal</option>
        <option>Gateway of India</option>
        <option>Goa Beaches</option>
        <option>Amer Fort</option>

    </select>

    <!-- Summary -->
    <p>
        My choices are:
        Country - India,
        State - Uttar Pradesh,
        City - Mathura,
        Favorite Tourist Place - Taj Mahal.
    </p>

</body>
</html>
