</head>
<body>

            <th rowspan="2">
                Student Name
            </th>

            <th colspan="5">
                Subject Marks

        </tr>

        <!-- Subject headings -->

            <th>DBMS</th>
            <th>Java</th>
            <th>Python</th>

            <th>Web Development</th>
        </tr>

        <!-- Student marks -->
        <tr>

            <td>Om Gupta</td>

            <td>85</td>
            <td>82</td>
            <td>90</td>
            <td>88</td>
            <td>92</td>

        </tr>

        <!-- Total -->

            <td colspan="2">
                Total
            </td>

            <td colspan="4">
                437 / 500
            </td>

        </tr>

        <!-- Percentage -->
        <tr>

            <td colspan="2">
                Percentage

                87.4%

        </tr>

    </table>

</body>
</html>
