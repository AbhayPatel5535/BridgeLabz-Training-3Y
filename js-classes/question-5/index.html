<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Q5 - Movie Ticket Booking</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 520px; margin: 32px auto; padding: 0 16px; }
    label { display: block; margin-top: 14px; }
    input { box-sizing: border-box; width: 100%; padding: 9px; margin-top: 5px; border: 2px solid #aaa; border-radius: 4px; }
    input.valid { border-color: #218838; }
    input.invalid { border-color: #dc3545; }
    .error { color: #dc3545; min-height: 18px; font-size: 0.9rem; }
    button { margin-top: 16px; padding: 10px 16px; cursor: pointer; }
    #ticket { border: 1px solid #ccc; padding: 14px; margin-top: 20px; }
  </style>
</head>
<body>
  <h1>Movie Ticket Booking</h1>
  <form id="bookingForm" novalidate>
    <label for="name">Name (alphabets only)</label>
    <input id="name" name="name" type="text">
    <p class="error" id="nameError"></p>

    <label for="email">Email</label>
    <input id="email" name="email" type="email">
    <p class="error" id="emailError"></p>

    <label for="seats">Seats (1 to 10)</label>
    <input id="seats" name="seats" type="number" min="1" max="10">
    <p class="error" id="seatsError"></p>

    <button type="submit">Book Ticket</button>
  </form>
  <section id="ticket" hidden>
    <h2>Ticket Details</h2>
    <p id="ticketDetails"></p>
  </section>
  <script src="script.js"></script>
</body>
</html>
