<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Q4 - Custom Form Builder</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 520px; margin: 32px auto; padding: 0 16px; }
    label { display: block; margin: 14px 0 5px; }
    input, select, textarea { box-sizing: border-box; width: 100%; padding: 9px; }
    button { margin-top: 18px; padding: 10px 16px; cursor: pointer; }
    pre { background: #f4f4f4; padding: 12px; white-space: pre-wrap; }
  </style>
</head>
<body>
  <h1>Custom Form Builder</h1>
  <div id="formContainer"></div>
  <h2>Submitted Form Data</h2>
  <pre id="output">Submit the form to see the values here.</pre>
  <script src="script.js"></script>
</body>
</html>
