<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aarav Mehta — Portfolio</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body class="bg-light">
  <main class="container text-center py-5">
    <!-- .container keeps content centered; spacing utilities control margin and padding. -->
    <header class="mb-4">
      <h1 class="fw-bold mb-1">Aarav Mehta</h1>
      <p class="text-secondary">Frontend Developer · UI Enthusiast · Problem Solver</p>
    </header>

    <section class="mb-4">
      <img src="https://images.unsplash.com/photo-1500648767791-00dcc994a43e?auto=format&fit=crop&w=400&q=80"
           alt="Professional profile portrait" class="img-fluid rounded-circle profile-img shadow-sm">
      <p class="lead text-dark mt-4 mx-auto bio">
        I create accessible, responsive websites that combine clean code with thoughtful user experiences.
      </p>
    </section>

    <section class="d-flex flex-wrap justify-content-center gap-2 mb-4">
      <a href="#contact" class="btn btn-primary px-4">Hire Me</a>
      <a href="#" class="btn btn-outline-dark px-4">Download CV</a>
    </section>

    <section id="contact" class="bg-white rounded-4 shadow-sm p-4 mx-auto contact-card text-start">
      <h2 class="h4 text-center fw-bold mb-3">Let's work together</h2>
      <form>
        <div class="mb-3">
          <label for="name" class="form-label">Name</label>
          <input id="name" type="text" class="form-control" placeholder="Your name">
        </div>
        <div class="mb-3">
          <label for="email" class="form-label">Email</label>
          <input id="email" type="email" class="form-control" placeholder="you@example.com">
        </div>
        <div class="mb-3">
          <label for="message" class="form-label">Message</label>
          <textarea id="message" class="form-control" rows="4" placeholder="Tell me about your project"></textarea>
        </div>
        <button type="submit" class="btn btn-dark w-100">Send Message</button>
      </form>
    </section>
  </main>
</body>
</html>
