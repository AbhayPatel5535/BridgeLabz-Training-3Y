<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Google Map</title>
</head>
<body>

    <h1>My City - Mathura</h1>

    <!-- loading="lazy" loads the map only when it is close to being visible -->
    <iframe
        src="https://www.google.com/maps?q=Mathura,Uttar+Pradesh,India&output=embed"
        title="Google Map showing Mathura"
        width="600"
        height="450"
        loading="lazy">
    </iframe>

</body>
</html>
