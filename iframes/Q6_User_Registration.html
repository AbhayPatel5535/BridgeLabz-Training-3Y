<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>User Registration</title>
</head>
<body>

    <h1>User Registration Form</h1>

    <form>

        <!-- Full Name -->
        <label for="fullname">Full Name:</label>
        <input
            type="text"
            id="fullname"
            name="fullname"
            required>

        <br><br>

        <!-- Email -->
        <label for="email">Email Address:</label>
        <input
            type="email"
            id="email"
            name="email"
            required>

        <br><br>

        <!-- Password -->
        <label for="password">Password:</label>
        <input
            type="password"
            id="password"
            name="password"
            required>

        <br><br>

        <!-- Confirm Password -->
        <label for="confirmPassword">Confirm Password:</label>
        <input
            type="password"
            id="confirmPassword"
            name="confirmPassword"
            required>

        <br><br>

        <input type="submit" value="Register">

    </form>

</body>
</html>
