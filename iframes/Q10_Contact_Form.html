<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Contact Form</title>
</head>
<body>

    <h1>Contact Us</h1>

    <form>

        <!-- Full Name -->
        <label for="name">Full Name:</label>
        <input
            type="text"
            id="name"
            name="name"
            placeholder="Enter your full name"
            required>

        <br><br>

        <!-- Email -->
        <label for="email">Email:</label>
        <input
            type="email"
            id="email"
            name="email"
            placeholder="Enter your email"
            required>

        <br><br>

        <!-- Subject -->
        <label for="subject">Subject:</label>
        <input
            type="text"
            id="subject"
            name="subject"
            placeholder="Enter subject"
            required>

        <br><br>

        <!-- Message -->
        <label for="message">Message:</label>
        <br>

        <textarea
            id="message"
            name="message"
            rows="6"
            cols="40"
            placeholder="Write your message here"
            required>
        </textarea>

        <br><br>

        <input type="submit" value="Send Message">

    </form>

</body>
</html>
