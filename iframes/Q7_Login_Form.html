<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login Form</title>
</head>
<body>

    <h1>Login Form</h1>

    <form>

        <!-- Username -->
        <label for="username">Username:</label>
        <input
            type="text"
            id="username"
            name="username">

        <br><br>

        <!-- Password -->
        <label for="password">Password:</label>
        <input
            type="password"
            id="password"
            name="password">

        <br><br>

        <!-- CSRF token is used to help protect forms from
             Cross-Site Request Forgery attacks. -->
        <input
            type="hidden"
            name="csrf_token"
            value="dummy12345">

        <input type="submit" value="Login">

    </form>

</body>
</html>
