<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>HTML Entities</title>
</head>
<body>

    <h1>HTML Entities</h1>

    <p>
        Less than: &lt;
    </p>

    <p>
        Greater than: &gt;
    </p>

    <p>
        Ampersand: &amp;
    </p>

    <p>
        Double quotation mark: &quot;
    </p>

    <p>
        Single quotation mark: &apos;
    </p>

    <p>
        Copyright: &copy;
    </p>

    <p>
        Trademark: &trade;
    </p>

    <p>
        Registered trademark: &reg;
    </p>

</body>
</html>
