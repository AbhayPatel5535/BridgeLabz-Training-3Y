<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Tooltip Demonstration</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>CSS Tooltip Demonstration</h1>
        <p>Hover over each item to reveal a smooth tooltip.</p>
    </header>

    <main>
        <section class="tooltip-area" aria-label="Tooltip examples">
            <div class="tooltip-item">
                <span class="icon">★</span>
                <span class="tooltip-text">A star represents a favorite item.</span>
            </div>

            <div class="tooltip-item">
                <span class="icon">?</span>
                <span class="tooltip-text">This symbol provides helpful information.</span>
            </div>

            <div class="tooltip-item">
                <span class="word">Hover</span>
                <span class="tooltip-text">The tooltip appears when you hover.</span>
            </div>

            <div class="tooltip-item">
                <span class="icon">✓</span>
                <span class="tooltip-text">A check mark indicates completion.</span>
            </div>
        </section>
    </main>

    <footer>
        <p>Assignment 8 &mdash; Question 2</p>
    </footer>
</body>
</html>
