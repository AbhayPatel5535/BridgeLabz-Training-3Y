<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Styled Button Collection</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Styled Button Collection</h1>
        <p>Primary, secondary, outline, disabled, focus, hover, and active states.</p>
    </header>

    <main>
        <section class="button-panel" aria-label="Button examples">
            <button class="btn btn-primary">Primary</button>
            <button class="btn btn-secondary">Secondary</button>
            <button class="btn btn-outline">Outline</button>
            <button class="btn btn-disabled" disabled>Disabled</button>
        </section>

        <section class="instructions">
            <h2>Try the states</h2>
            <p>Hover over a button, click and hold it for the active state, or use the Tab key to see the focus outline.</p>
        </section>
    </main>

    <footer>
        <p>Assignment 8 &mdash; Question 5</p>
    </footer>
</body>
</html>
