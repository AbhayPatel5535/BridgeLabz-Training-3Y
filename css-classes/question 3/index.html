<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Showcase</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Image Showcase</h1>
        <p>Six responsive images with hover zoom and a dark overlay.</p>
    </header>

    <main>
        <section class="gallery" aria-label="Image gallery">
            <figure class="gallery-card">
                <div class="image-wrap">
                    <img src="https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?auto=format&fit=crop&w=900&q=80" alt="Mountain landscape">
                    <div class="overlay"></div>
                </div>
                <figcaption>Mountain Escape</figcaption>
            </figure>

            <figure class="gallery-card">
                <div class="image-wrap">
                    <img src="https://images.unsplash.com/photo-1506744038136-46273834b3fb?auto=format&fit=crop&w=900&q=80" alt="Lake surrounded by mountains">
                    <div class="overlay"></div>
                </div>
                <figcaption>Peaceful Lake</figcaption>
            </figure>

            <figure class="gallery-card">
                <div class="image-wrap">
                    <img src="https://images.unsplash.com/photo-1470770841072-f978cf4d019e?auto=format&fit=crop&w=900&q=80" alt="Green mountain valley">
                    <div class="overlay"></div>
                </div>
                <figcaption>Green Valley</figcaption>
            </figure>

            <figure class="gallery-card">
                <div class="image-wrap">
                    <img src="https://images.unsplash.com/photo-1511497584788-876760111969?auto=format&fit=crop&w=900&q=80" alt="Forest trees">
                    <div class="overlay"></div>
                </div>
                <figcaption>Forest Trail</figcaption>
            </figure>

            <figure class="gallery-card">
                <div class="image-wrap">
                    <img src="https://images.unsplash.com/photo-1507525428034-b723cf961d3e?auto=format&fit=crop&w=900&q=80" alt="Blue ocean and beach">
                    <div class="overlay"></div>
                </div>
                <figcaption>Ocean View</figcaption>
            </figure>

            <figure class="gallery-card">
                <div class="image-wrap">
                    <img src="https://images.unsplash.com/photo-1500534623283-312aade485b7?auto=format&fit=crop&w=900&q=80" alt="Scenic road through nature">
                    <div class="overlay"></div>
                </div>
                <figcaption>Scenic Journey</figcaption>
            </figure>
        </section>
    </main>

    <footer>
        <p>Assignment 8 &mdash; Question 3</p>
    </footer>
</body>
</html>
