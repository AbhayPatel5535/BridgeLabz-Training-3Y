<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Image Gallery with Modal</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 900px; margin: 35px auto; padding: 0 16px; }
    .gallery { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
    .gallery img { width: 100%; height: 170px; object-fit: cover; cursor: pointer; border-radius: 8px; }
    .modal { position: fixed; inset: 0; display: flex; justify-content: center; align-items: center; padding: 20px; background: rgb(0 0 0 / 85%); }
    .modal[hidden] { display: none; }
    .modal-content { max-width: min(900px, 95vw); max-height: 90vh; }
    .modal-content img { display: block; max-width: 100%; max-height: 85vh; object-fit: contain; }
    @media (max-width: 600px) { .gallery { grid-template-columns: repeat(2, 1fr); } }
  </style>
</head>
<body>
  <h1>Image Gallery</h1>
  <p>Click an image to see a larger preview. Click the dark background to close it.</p>

  <div class="gallery" id="gallery">
    <img src="https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?w=600" alt="Mountain landscape">
    <img src="https://images.unsplash.com/photo-1470770841072-f978cf4d019e?w=600" alt="Lake and mountains">
    <img src="https://images.unsplash.com/photo-1507525428034-b723cf961d3e?w=600" alt="Ocean beach">
    <img src="https://images.unsplash.com/photo-1470252649378-9c29740c9fa8?w=600" alt="Sunrise landscape">
    <img src="https://images.unsplash.com/photo-1441974231531-c6227db76b6e?w=600" alt="Forest path">
    <img src="https://images.unsplash.com/photo-1464822759023-fed622ff2c3b?w=600" alt="Snowy mountains">
  </div>

  <div class="modal" id="imageModal" hidden>
    <div class="modal-content" id="modalContent">
      <img id="previewImage" src="" alt="Large image preview">
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
