<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Theme Switcher</title>
  <style>
    body { font-family: Arial, sans-serif; min-height: 100vh; margin: 0; padding: 40px 20px; box-sizing: border-box; transition: background .2s, color .2s; }
    body.light { background: #ffffff; color: #222222; }
    body.dark { background: #202124; color: #f5f5f5; }
    body.blue { background: #dceeff; color: #12365a; }
    .panel { max-width: 600px; margin: auto; padding: 24px; border: 1px solid currentColor; border-radius: 12px; }
    button { padding: 10px 16px; margin: 6px 4px 6px 0; cursor: pointer; }
  </style>
</head>
<body class="light" data-theme="light">
  <main class="panel">
    <h1>Theme Switcher</h1>
    <p>Choose a theme. The selected theme is stored in the body's data-theme attribute.</p>
    <button type="button" data-theme-choice="light">Light</button>
    <button type="button" data-theme-choice="dark">Dark</button>
    <button type="button" data-theme-choice="blue">Blue</button>
    <p>Current theme: <strong id="currentTheme">light</strong></p>
  </main>
  <script src="script.js"></script>
</body>
</html>
