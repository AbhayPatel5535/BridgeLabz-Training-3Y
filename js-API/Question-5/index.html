<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Q5 - College Timetable Viewer</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; padding: 35px 18px; font-family: Arial, sans-serif; background: #f3f6fb; color: #1d2939; }
    main { max-width: 900px; margin: auto; }
    header, .timetable-panel { padding: 24px; background: white; border-radius: 14px; box-shadow: 0 5px 20px #17203310; }
    h1 { margin-top: 0; color: #2457a6; }
    select { padding: 11px 14px; border: 1px solid #cbd5e1; border-radius: 8px; min-width: 200px; }
    table { width: 100%; margin-top: 18px; border-collapse: collapse; }
    th, td { padding: 13px; text-align: left; border-bottom: 1px solid #e5eaf1; }
    th { background: #eef4ff; color: #2457a6; }
    #message { color: #64748b; }
    @media (max-width: 600px) { th, td { padding: 9px 6px; font-size: .9rem; } }
  </style>
</head>
<body>
  <main>
    <header><h1>College Timetable Viewer</h1><p>Select a weekday to view your classes.</p></header>
    <section class="timetable-panel" aria-label="Timetable">
      <label for="daySelect">Select day:</label>
      <select id="daySelect">
        <option>Monday</option><option>Tuesday</option><option>Wednesday</option>
        <option>Thursday</option><option>Friday</option>
      </select>
      <p id="message" role="status">Loading timetable...</p>
      <div id="timetable"></div>
    </section>
  </main>
  <script src="script.js"></script>
</body>
</html>
