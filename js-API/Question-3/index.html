<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Q3 - Task Manager With Filters</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; padding: 35px 18px; font-family: Arial, sans-serif; background: #f3f6fb; color: #1d2939; }
    main { max-width: 850px; margin: auto; }
    header, .tasks-panel { padding: 24px; background: white; border-radius: 14px; box-shadow: 0 5px 20px #17203310; }
    h1 { margin-top: 0; color: #2457a6; }
    select { padding: 10px 12px; border: 1px solid #cbd5e1; border-radius: 8px; }
    .task { display: flex; align-items: center; gap: 12px; padding: 14px 0; border-bottom: 1px solid #e5eaf1; }
    .task:last-child { border-bottom: 0; }
    .task-title { flex: 1; }
    .priority { padding: 4px 9px; border-radius: 20px; font-size: .8rem; background: #eef2ff; }
    .completed .task-title { text-decoration: line-through; color: #94a3b8; }
    #message { color: #b42318; }
  </style>
</head>
<body>
  <main>
    <header><h1>Task Manager</h1><p>Filter tasks by priority or completion status.</p></header>
    <section class="tasks-panel" aria-label="Task list">
      <label for="taskFilter">Show tasks:</label>
      <select id="taskFilter">
        <option value="all">All Tasks</option>
        <option value="low">Low Priority</option>
        <option value="medium">Medium Priority</option>
        <option value="high">High Priority</option>
        <option value="completed">Completed</option>
      </select>
      <p id="message" role="status"></p>
      <div id="taskList"></div>
    </section>
  </main>
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
