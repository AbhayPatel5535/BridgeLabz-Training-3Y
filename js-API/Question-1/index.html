<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Q1 - Real-Time Live Search</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; padding: 35px 18px; font-family: Arial, sans-serif; background: #f3f6fb; color: #1d2939; }
    main { max-width: 900px; margin: auto; }
    header, .search-panel { background: white; padding: 24px; border-radius: 14px; box-shadow: 0 5px 20px #17203310; }
    h1 { margin-top: 0; color: #2457a6; }
    input { width: 100%; padding: 13px 15px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 1rem; }
    #status { min-height: 24px; margin: 14px 0; color: #64748b; }
    .products { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 16px; }
    .product { padding: 15px; background: white; border-radius: 12px; box-shadow: 0 4px 15px #17203310; }
    .product img { width: 100%; height: 135px; object-fit: cover; border-radius: 8px; background: #e2e8f0; }
    .product h2 { font-size: 1.05rem; }
    .price { color: #16835d; font-weight: bold; }
  </style>
</head>
<body>
  <main>
    <header><h1>Product Live Search</h1><p>Start typing to search products instantly.</p></header>
    <section class="search-panel" aria-label="Search products">
      <label for="searchInput">Search products</label>
      <input id="searchInput" type="search" placeholder="Search by product name..." autocomplete="off">
      <p id="status" aria-live="polite">Enter a product name to begin.</p>
    </section>
    <section id="results" class="products" aria-label="Search results"></section>
  </main>
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
