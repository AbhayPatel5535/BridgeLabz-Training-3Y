<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Q10 - Complete Layout</title>
<link rel="stylesheet" href="q10.css">
</head>
<body>
  <header class="sticky">
    <nav><a href="#home">Home</a> <a href="#about">About</a> <a href="#services">Services</a> <a href="#contact">Contact</a></nav>
  </header>
  <section id="home" class="hero">
    <div class="hero-text">Welcome to Our Site</div>
  </section>
  <section id="about" class="about">
    <div class="col text">
      <h2>About Us</h2>
      <p>We build things that matter.</p>
    </div>
    <div class="col img"><img src="https://picsum.photos/seed/about/500/330" alt="about"></div>
  </section>
  <section id="services" class="services">
    <div class="service">Service A</div>
    <div class="service">Service B</div>
    <div class="service">Service C</div>
  </section>
  <section id="contact" class="contact">
    <form>
      <input placeholder="Name">
      <input placeholder="Email">
      <button>Send</button>
    </form>
  </section>
  <footer>© 2026 Company</footer>
</body>
</html>
