<body>
  <header><h1>Pricing Plans</h1></header>

      <ul><li>5 Projects</li><li>Priority support</li></ul>

      <ul><li>Unlimited</li><li>Phone support</li></ul>
      <div class="price">$39/mo</div>
      <a class="btn" href="#">Choose</a>
